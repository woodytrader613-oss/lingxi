<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A111D">
<title>我的股息現金流</title>
<style>
:root{
  --bg:#070C15; --app:#0A111D; --panel:#0F1A2B; --panel2:#132239; --line:#22334D; --line2:#2D4262;
  --ink:#EAF0F8; --ink2:#C7D2E2; --muted:#8D9BB2; --dim:#5D6C85;
  --bar:#6EC3FF; --bar2:#3E8FD0; --track:#16253B; --gold:#F5C542; --green:#5BD6A0; --red:#FF8A80;
  --font: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
body{min-height:100vh;display:flex;justify-content:center}
.stage{padding:28px 16px 40px}
.phone{width:400px;height:844px;border-radius:36px;border:1px solid var(--line);background:var(--app);box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;position:relative}
.scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
@media (max-width:480px){.stage{padding:0;width:100%}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:rgba(10,17,29,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;letter-spacing:.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;flex:none}
.btn.primary{background:var(--bar);border-color:var(--bar);color:#04121F}
.body{padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.card + .card{margin-top:12px}
.hold{display:flex;align-items:center;gap:10px}
.hold .t{font-size:13px;color:var(--muted);flex:none}
.hold .t b{color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:12px;padding:5px 9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--dim);margin-top:3px}
.kpi.big{grid-column:1/-1}
.kpi.big .v{font-size:30px;color:var(--gold)}
.cover{grid-column:1/-1;border-top:1px dashed var(--line2);padding-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cover label{font-size:12.5px;color:var(--muted)}
.cover input{width:110px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:0 10px;font-size:16px;font-variant-numeric:tabular-nums}
.cover .res{font-size:13px;color:var(--ink2)}
.cover .res b{color:var(--green);font-size:15px}
.cover .res b.low{color:var(--gold)}
.ph h2{margin:0;font-size:20px;font-weight:800;letter-spacing:.5px}
.ph p{margin:6px 0 14px;font-size:12.5px;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin:-6px 0 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ydiv{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin:8px 0 2px 2px;padding-top:8px;border-top:1px dashed var(--line)}
.ydiv:first-child{margin-top:0;padding-top:0;border-top:0}
.mrow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:9px 2px}
.mrow .m{font-size:14px;color:var(--ink2);text-align:right}
.mrow.cur .m{color:var(--gold);font-weight:700}
.track{position:relative;height:9px;border-radius:5px;background:var(--track)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;display:flex;overflow:hidden}
.fill .paid{background:var(--bar)}
.fill .est{background:rgba(110,195,255,.16);box-shadow:inset 0 0 0 1px rgba(110,195,255,.55)}
.fill .pend{background:repeating-linear-gradient(-45deg,var(--bar2) 0 4px,#2B6A9C 4px 8px)}
.phh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:5px 9px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--bar);color:#04121F}
.exp{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed rgba(245,197,66,.75)}
.amt{font-size:14.5px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:96px}
.amt.dash{color:var(--dim);font-weight:600}
.note{font-size:11.5px;color:var(--dim);line-height:1.7;margin:14px 4px 0}
.note b{color:var(--muted)}
.emptyhint{text-align:center;padding:30px 10px;color:var(--muted);font-size:14px;line-height:1.8}
/* 庫存編輯（獨立畫面） */
.sheet{position:absolute;inset:0;z-index:20;background:var(--app);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet .top{position:relative}
.sheet .list{flex:1;overflow:auto;padding:12px 14px 20px}
.hint{font-size:12px;color:var(--muted);margin:2px 4px 12px;line-height:1.6}
.hrow{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;align-items:start;margin-bottom:10px}
.hrow input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);padding:0 12px;font-size:16px}
.hrow input.bad{border-color:var(--red)}
.hrow .nm{font-size:11.5px;color:var(--muted);margin:4px 4px 0;min-height:15px}
.hrow .nm.bad{color:var(--red)}
.hrow .del{height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.hhead{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;font-size:12px;color:var(--muted);margin:0 4px 6px}
.add{width:100%;height:44px;border-radius:12px;border:1px dashed var(--line2);background:transparent;color:var(--bar);font-size:14px;font-weight:600;cursor:pointer}
.sheet .foot{display:flex;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet .foot .btn{flex:1;height:46px;border-radius:14px;font-size:15px}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#1F3352;color:var(--ink);font-size:13px;padding:9px 16px;border-radius:18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1}
#loader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .25s}
#loader.done{opacity:0;pointer-events:none}
#loader .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--bar);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.embed,.embed body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.embed .stage{padding:0;width:100%}
.embed .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div id="loader" role="status" aria-label="載入中"><div class="spin"></div></div>
<div class="stage"><div class="phone" id="phone"><div class="scroll" id="scroll">
  <div class="top">
    <h1>我的股息現金流</h1>
    <button class="btn" type="button" id="btnShare">分享</button>
    <button class="btn" type="button" id="btnEdit">編輯庫存</button>
  </div>
  <div class="body">
    <div class="card hold">
      <div class="t">庫存 <b id="hcount">0</b> 檔</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card"><div class="kpis" id="kpis"></div></div>
    <div class="card">
      <div class="ph">
        <div class="phh"><h2>未來 12 個月現金流</h2>
          <div class="seg" id="seg"><button type="button" data-v="1">含預估</button><button type="button" data-v="0">只看公告</button></div></div>
        <p id="range">以發放日入帳計算。</p>
      </div>
      <div class="legend">
        <span><i style="background:var(--bar)"></i>已入帳</span>
        <span><i style="background:repeating-linear-gradient(-45deg,var(--bar2) 0 3px,#2B6A9C 3px 6px)"></i>已公告・待發放</span>
        <span id="lgEst"><i style="background:rgba(110,195,255,.16);box-shadow:inset 0 0 0 1px rgba(110,195,255,.6)"></i>預估</span>
        <span id="lgExp" hidden><i style="background:transparent;border-left:2px dashed var(--gold);border-radius:0;width:2px"></i>每月開銷</span>
      </div>
      <div id="months"></div>
    </div>
    <p class="note" id="note"></p>
  </div>
  </div>

  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="top">
      <h1>編輯庫存</h1>
      <button class="btn" type="button" id="btnSample">範例</button>
    </div>
    <div class="list">
      <p class="hint">輸入股票或 ETF 代號與目前持有股數（1 張 = 1,000 股）。上市、上櫃個股與台股 ETF 都可以。儲存後依這份庫存推算未來 12 個月的股息。</p>
      <div class="hhead"><span>代號</span><span>股數</span><span></span></div>
      <div id="hrows"></div>
      <button class="add" type="button" id="btnAdd">＋ 新增一檔</button>
    </div>
    <div class="foot">
      <button class="btn" type="button" id="btnCancel">取消</button>
      <button class="btn primary" type="button" id="btnSave">儲存</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div></div>
<datalist id="codes"></datalist>

<script>
/* ===== 資料來源（每天由雪鴞同步程式更新）=====
   個股：「個股配息上傳」Apps Script 的 /exec 網址（Google Sheet；上市＋上櫃）
   ETF ：「領息大地圖（雪鴞版）」Apps Script 的 /exec 網址（與領息大地圖共用） */
const STOCK_URL = 'https://script.google.com/macros/s/AKfycbyLWNvrA-aBZscUEcS48o1ItUmZoHEnl8IovlhARDmiS9JxDfpv3qsew3bWjkWlsUOT0Q/exec';
const ETF_URL = 'https://script.google.com/macros/s/AKfycbxj5wW6Ve2zNvp0SJS3zluGE_yd7WyNWP6HrPHGVwZDblQR0JSQPA9MPoZ9IDDvXd4F/exec';
let DATA = null;
const SAMPLE = [['0056', 10000], ['00878', 10000], ['00919', 10000], ['2330', 1000], ['2412', 3000], ['2884', 20000]];
const KEY_H = 'divflow_holdings_v1', KEY_X = 'divflow_expense_v1', KEY_E = 'divflow_showest_v1';
const NHI_RATE = 0.0211, NHI_MIN = 20000;            // 二代健保補充保費（現制：單筆達 2 萬元扣 2.11%）
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const md = d => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const ymd = d => `${d.slice(0, 4)}/${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const QS = new URLSearchParams(location.search);
const REAL_TODAY = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' });   // YYYY-MM-DD（台北時間）
const SIM = /^\d{4}-\d{2}-\d{2}$/.test(QS.get('asof') || '') ? QS.get('asof') : '';
const TODAY = SIM || REAL_TODAY;          // 網址加 ?asof=2026-03-10 可模擬「站在那一天」看畫面（測試用）
const YEAR = TODAY.slice(0, 4);

const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const addMonths = (d, n) => { const t = new Date(d + 'T00:00:00Z'); const day = t.getUTCDate(); t.setUTCDate(1); t.setUTCMonth(t.getUTCMonth() + n); const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate(); t.setUTCDate(Math.min(day, last)); return t.toISOString().slice(0, 10); };
const dayDiff = (a, b) => Math.round((new Date(a + 'T00:00:00Z') - new Date(b + 'T00:00:00Z')) / 864e5);
const weekday = d => { let t = d; for (let i = 0; i < 3; i++) { const w = new Date(t + 'T00:00:00Z').getUTCDay(); if (w === 0 || w === 6) t = addDays(t, 1); else break; } return t; };

/* ===== 滾動 12 個月：本月 → 11 個月後 ===== */
const START = TODAY.slice(0, 7) + '-01';
const WIN = Array.from({ length: 12 }, (_, i) => { const d = addMonths(START, i); return { y: +d.slice(0, 4), m: +d.slice(5, 7) }; });
const WIN_END = new Date(Date.UTC(WIN[11].y, WIN[11].m, 0)).toISOString().slice(0, 10);
const mIdx = d => { if (!d) return -1; const i = (+d.slice(0, 4) - WIN[0].y) * 12 + (+d.slice(5, 7) - WIN[0].m); return i >= 0 && i < 12 ? i : -1; };

function lots(sh) {
  const z = Math.floor(sh / 1000), r = sh % 1000;
  if (z && !r) return `${fmt(z)} 張`;
  if (z) return `${fmt(z)} 張 ${r} 股`;
  return `${fmt(r)} 股`;
}

/* ===== 庫存：分享連結 ?h=0056:10000,2330:1000 優先，其次瀏覽器儲存 ===== */
function parseH(s) {
  const m = new Map();
  String(s || '').split(',').forEach(p => {
    const [c, n] = p.split(':');
    const code = String(c || '').trim().toUpperCase(), sh = Math.floor(+String(n || '').replace(/[^\d]/g, ''));
    if (/^[0-9A-Z]{4,6}$/.test(code) && sh > 0) m.set(code, (m.get(code) || 0) + sh);
  });
  return [...m.entries()];
}
const encodeH = h => h.map(([c, s]) => `${c}:${s}`).join(',');
let fromLink = false;
let holdings = (() => {
  const h = parseH(QS.get('h'));
  if (h.length) { fromLink = true; store.set(KEY_H, h); return h; }
  return store.get(KEY_H, null) || SAMPLE.slice();
})();
let expense = store.get(KEY_X, 0);
let showEst = store.get(KEY_E, true);   // 預設含預估
const actualByCode = {};                // 今年＋去年的正式配息（含已公告未發放）

function shareURL() {
  const q = new URLSearchParams();
  q.set('h', encodeH(holdings));
  return location.origin + location.pathname + '?' + q.toString().replace(/%3A/g, ':').replace(/%2C/g, ',');
}
function syncURL() {   // 網址列跟著目前庫存，方便加入書籤
  try {
    const q = new URLSearchParams(location.search);
    if (holdings.length) q.set('h', encodeH(holdings)); else q.delete('h');
    const s = q.toString().replace(/%3A/g, ':').replace(/%2C/g, ',');
    history.replaceState(null, '', location.pathname + (s ? '?' + s : ''));
  } catch (e) {}
}

/* 模擬模式：除息日超過模擬日 30 天以上的，視為當時尚未公告 */
const announced = e => !SIM || e.ex <= addDays(SIM, 30);

/* ===== 預估（尚未公告的配息）=====
   ETF：最近一次配息金額 × 配息頻率往後排
   個股：去年同期（每一筆正式配息往後平移 12 個月；與正式公告相差 60 天內視為同一期） */
function estimatesFor(code, known) {
  const out = [];
  const isETF = (DATA.sec[code] || [])[1] === 'ETF';
  const base = known.filter(e => e.cash > 0).sort((a, b) => a.ex < b.ex ? -1 : 1);
  if (isETF && base.length >= 2) {
    const last = base[base.length - 1];
    const gaps = [];
    for (let i = 1; i < base.length; i++) gaps.push(dayDiff(base[i].ex, base[i - 1].ex));
    gaps.sort((a, b) => a - b);
    const g = gaps[Math.floor(gaps.length / 2)];
    const step = g < 50 ? 1 : g < 130 ? 3 : g < 250 ? 6 : 12;
    const lag = last.pay ? Math.max(7, dayDiff(last.pay, last.ex)) : 25;
    for (let k = 1; k <= 30; k++) {
      const ex = weekday(addMonths(last.ex, step * k));
      if (ex > WIN_END) break;
      const pay = weekday(addDays(ex, lag));
      if (mIdx(pay) < 0 || addDays(ex, 30) < TODAY) continue;   // 不在期間內，或早該公告卻沒公告
      out.push({ code, ex, pay, cash: last.cash, estimate: true, basis: `參考最近一次 ${ymd(last.ex)} 除息，每單位 ${+last.cash.toFixed(4)}` });
    }
    return out;
  }
  const used = new Set();
  base.forEach(p => {
    const ex = weekday(addMonths(p.ex, 12));
    let best = -1, bd = 61;
    known.forEach((c, i) => { const d = Math.abs(dayDiff(c.ex, ex)); if (!used.has(i) && d < bd) { bd = d; best = i; } });
    if (best >= 0) { used.add(best); return; }                    // 同期已公告 → 以正式為準
    const pay = p.pay ? weekday(addMonths(p.pay, 12)) : weekday(addDays(ex, 30));
    if (mIdx(pay) < 0 || addDays(ex, 30) < TODAY) return;          // 不在期間內，或已過期仍未公告（可能停發）
    out.push({ code, ex, pay, cash: p.cash, estimate: true, basis: `參考去年 ${ymd(p.pay || p.ex)} 發放，每股 ${+p.cash.toFixed(4)}` });
  });
  return out;
}
function compute() {
  const months = Array.from({ length: 12 }, () => ({ paid: 0, pend: 0, est: 0, items: [] }));
  holdings.forEach(([code, sh]) => {
    const known = (actualByCode[code] || []).filter(announced);
    const list = known.map(e => e.pay ? e : { ...e, pay: weekday(addDays(e.ex, 30)), inferred: true });
    if (showEst) estimatesFor(code, known).forEach(e => list.push(e));
    list.forEach(e => {
      if (!(e.cash > 0)) return;                                   // 只算現金股利，配股不計
      const m = mIdx(e.pay);
      if (m < 0) return;
      const amt = sh * e.cash;
      const it = { ...e, sh, amt, paid: !e.estimate && e.pay <= TODAY };
      months[m].items.push(it);
      if (e.estimate) months[m].est += amt; else if (it.paid) months[m].paid += amt; else months[m].pend += amt;
    });
  });
  months.forEach(m => m.items.sort((a, b) => a.pay < b.pay ? -1 : a.pay > b.pay ? 1 : b.amt - a.amt));
  return months;
}
function render() {
  $('hcount').textContent = holdings.length;
  $('chips').innerHTML = holdings.map(([c, s]) => `<span class="chip">${c} ${(DATA.sec[c] || [''])[0]}・${lots(s)}</span>`).join('');
  const months = compute();
  const paid = months.reduce((s, m) => s + m.paid, 0), pend = months.reduce((s, m) => s + m.pend, 0), est = months.reduce((s, m) => s + m.est, 0);
  const total = paid + pend + est, avg = total / 12;
  const rangeTxt = `${WIN[0].y}/${WIN[0].m}～${WIN[11].y}/${WIN[11].m}`;
  const cov = expense > 0
    ? `平均每月可 cover <b class="${avg < expense ? 'low' : ''}">${(avg / expense * 100).toFixed(0)}%</b>`
    : '輸入每月開銷，看股息能 cover 幾成';
  $('kpis').innerHTML = `
    <div class="kpi big"><div class="l">未來 12 個月預計領息</div><div class="v">NT$${fmt(total)}</div><div class="s">${rangeTxt}・以發放日計${SIM ? `・模擬 ${SIM}` : ''}</div></div>
    <div class="kpi"><div class="l">平均每月</div><div class="v">NT$${fmt(avg)}</div><div class="s">12 個月合計 ÷ 12</div></div>
    <div class="kpi"><div class="l">已公告</div><div class="v">NT$${fmt(paid + pend)}</div><div class="s">${showEst ? `另有預估 ${fmt(est)}` : '不含預估'}${paid ? `・本月已入帳 ${fmt(paid)}` : ''}</div></div>
    <div class="cover"><label for="exp">每月開銷</label><input id="exp" inputmode="numeric" placeholder="例：30000" value="${expense ? fmt(expense) : ''}"><span class="res">${cov}</span></div>`;
  $('exp').onchange = e => { expense = +String(e.target.value).replace(/[^\d.]/g, '') || 0; store.set(KEY_X, expense); render(); };
  $('range').textContent = `${rangeTxt}，以發放日入帳計算，每月為庫存合計。`;
  const max = Math.max(1, ...months.map(m => m.paid + m.pend + m.est), expense || 0);
  $('lgExp').hidden = !(expense > 0);
  $('lgEst').hidden = !showEst;
  document.querySelectorAll('#seg button').forEach(b => { b.classList.toggle('on', (b.dataset.v === '1') === showEst); b.onclick = () => { showEst = b.dataset.v === '1'; store.set(KEY_E, showEst); render(); }; });
  if (!holdings.length) {
    $('months').innerHTML = `<div class="emptyhint">還沒有庫存<br>點右上角「編輯庫存」輸入持股</div>`;
  } else {
    $('months').innerHTML = months.map((m, i) => {
      const w = WIN[i], tot = m.paid + m.pend + m.est;
      const exp = expense > 0 ? `<div class="exp" style="left:${(expense / max * 100).toFixed(2)}%"></div>` : '';
      const yd = (i === 0 || w.m === 1) ? `<div class="ydiv">${w.y} 年</div>` : '';
      return `${yd}
      <div class="mrow ${i === 0 ? 'cur' : ''}">
        <div class="m">${w.m} 月</div>
        <div class="track"><div class="fill" style="width:${(tot / max * 100).toFixed(2)}%"><div class="paid" style="flex:${m.paid}"></div><div class="pend" style="flex:${m.pend}"></div><div class="est" style="flex:${m.est}"></div></div>${exp}</div>
        <div class="amt ${tot ? '' : 'dash'}">${tot ? 'NT$' + fmt(tot) : '—'}</div>
      </div>`;
    }).join('');
  }
  $('note').innerHTML = `<b>計算方式</b>：以目前庫存股數計算，期間為本月起滾動 12 個月（${rangeTxt}）；每筆股息 = 股數 × 每股現金股利，於「股息發放日」入帳，只要發放日落在期間內就計入（不考慮買進時間），不再投入。只計現金股利，<b>配股不計</b>。尚未公布發放日的，以除息日後約 30 天推估；部分月配 ETF 的發放日或金額依過去規律推估。
  <br><b>預估</b>：尚未公告的配息，個股依去年同期、ETF 依最近一次配息金額與配息頻率往後推算；去年同期已過一個月仍未公告的視為停發。實際以公司公告為準。
  <br><b>實際入帳會再少一些</b>：畫面金額為股利總額，未扣除以下費用。①二代健保補充保費：單筆股利達 NT$${fmt(NHI_MIN)} 元，由發放單位直接扣 ${(NHI_RATE * 100).toFixed(2)}%（例：單筆 3 萬元扣 ${fmt(30000 * NHI_RATE)} 元；單筆上限 1,000 萬元；年度結算新制已暫緩，若有變動以健保署公告為準）。ETF 只有收益分配中的股利所得部分要扣。②匯費：每筆約 10 元，依各公司規定。③股利所得稅：隔年 5 月報稅時，可選「合併計稅」（股利 8.5% 可抵減稅額，每戶上限 8 萬元）或「分開計稅」（28% 單一稅率），依個人稅率而定，入帳時不會先扣。
  <br>資料：雪鴞 API，資料日 ${DATA.updated ? ymd(DATA.updated) : '—'}。依歷史資料試算，不代表未來配息，不構成投資建議。${SIM ? `<br>目前為模擬模式：站在 ${SIM} 看畫面。` : ''}`;
}
/* ---------- 庫存編輯 ---------- */
let draft = [];
function nameOf(c) { const s = DATA.sec[c]; return s ? `${s[0]}・${s[1]}${actualByCode[c] ? '' : '・近兩年無配息'}` : ''; }
function openSheet() {
  if (!DATA) return;
  draft = holdings.map(h => [h[0], h[1]]);
  if (!draft.length) draft.push(['', '']);
  drawRows();
  $('sheet').classList.add('show'); $('sheet').setAttribute('aria-hidden', 'false');
}
function closeSheet() { $('sheet').classList.remove('show'); $('sheet').setAttribute('aria-hidden', 'true'); }
function drawRows() {
  $('hrows').innerHTML = draft.map((r, i) => `
    <div class="hrow" data-i="${i}">
      <div><input class="cd" list="codes" placeholder="例：0056" value="${r[0]}" autocomplete="off" autocapitalize="characters"><div class="nm">${nameOf(r[0])}</div></div>
      <div><input class="sh" inputmode="numeric" placeholder="股數" value="${r[1] ? fmt(r[1]) : ''}"><div class="nm">${r[1] ? lots(r[1]) : ''}</div></div>
      <button class="del" type="button" aria-label="刪除">×</button>
    </div>`).join('');
  document.querySelectorAll('.hrow').forEach(row => {
    const i = +row.dataset.i, cd = row.querySelector('.cd'), sh = row.querySelector('.sh');
    cd.oninput = () => {
      const v = cd.value.trim().toUpperCase().split(/\s/)[0]; draft[i][0] = v;
      const nm = row.querySelectorAll('.nm')[0];
      nm.textContent = nameOf(v) || (v ? '查無此代號' : ''); nm.classList.toggle('bad', !!v && !DATA.sec[v]); cd.classList.remove('bad');
    };
    cd.onchange = () => { cd.value = draft[i][0]; };
    sh.oninput = () => {
      const n = +sh.value.replace(/[^\d]/g, '') || 0; draft[i][1] = n;
      row.querySelectorAll('.nm')[1].textContent = n ? lots(n) : ''; sh.classList.remove('bad');
    };
    sh.onblur = () => { sh.value = draft[i][1] ? fmt(draft[i][1]) : ''; };
    row.querySelector('.del').onclick = () => { draft.splice(i, 1); if (!draft.length) draft.push(['', '']); drawRows(); };
  });
}
function save() {
  const rows = draft.filter(r => r[0] || r[1]);
  let bad = false;
  document.querySelectorAll('.hrow').forEach(row => {
    const i = +row.dataset.i, r = draft[i]; if (!r[0] && !r[1]) return;
    if (!DATA.sec[r[0]]) { row.querySelector('.cd').classList.add('bad'); bad = true; }
    if (!(r[1] > 0)) { row.querySelector('.sh').classList.add('bad'); bad = true; }
  });
  if (bad) { toast('請修正標紅的代號或股數'); return; }
  const merged = new Map();
  rows.forEach(([c, s]) => { merged.set(c, (merged.get(c) || 0) + s); });
  holdings = [...merged.entries()];
  store.set(KEY_H, holdings);
  syncURL();
  postToApp({ type: 'holdings', h: encodeH(holdings) });
  closeSheet(); render(); toast('庫存已儲存');
}
/* ---------- 分享連結 ---------- */
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise((ok, no) => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? ok() : no(); } catch (e) { no(e); } finally { ta.remove(); }
  });
}
function share() {
  if (!holdings.length) { toast('還沒有庫存可以分享'); return; }
  const url = shareURL();
  postToApp({ type: 'share', url, h: encodeH(holdings) });
  if (navigator.share && !document.documentElement.classList.contains('embed')) {
    navigator.share({ title: '我的股息現金流', url }).catch(() => {});
    return;
  }
  copyText(url).then(() => toast('已複製分享連結，換裝置貼上就能看到同一份庫存'), () => toast('無法自動複製，請長按網址列複製'));
}
let tt;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200); }
$('btnEdit').onclick = openSheet;
$('btnShare').onclick = share;
$('btnCancel').onclick = closeSheet;
$('btnSave').onclick = save;
$('btnAdd').onclick = () => { draft.push(['', '']); drawRows(); const r = document.querySelectorAll('.hrow .cd'); r[r.length - 1].focus(); };
$('btnSample').onclick = () => { draft = SAMPLE.map(x => x.slice()); drawRows(); };
/* ---------- 讀取資料 ---------- */
function getJSON(url, label, year) {
  if (!url || url.indexOf('請貼上') >= 0) return Promise.reject(new Error(label + '資料網址尚未設定'));
  return fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'format=json&year=' + (year || YEAR), { cache: 'no-store' })
    .then(r => r.text())
    .then(t => {
      t = t.trim();
      if (t.charAt(0) === '<') throw new Error(label + '資料服務回傳網頁而不是資料（請確認 Apps Script 已部署新版本、存取權為「所有人」）');
      return JSON.parse(t);
    })
    .catch(e => { throw new Error(e && e.message && e.message.indexOf('Failed to fetch') < 0 ? e.message : label + '資料服務連不到'); });
}
function addActual(code, e) {
  const a = actualByCode[code] = actualByCode[code] || [];
  if (!a.some(x => x.ex === e.ex)) a.push(e);
}
function boot() {
  const PREV = String(+YEAR - 1);
  Promise.allSettled([getJSON(STOCK_URL, '個股'), getJSON(ETF_URL, 'ETF'), getJSON(STOCK_URL, '個股（前一年）', PREV)]).then(([st, et, sp]) => {
    const sec = {}, warn = [];
    let updated = '', n = 0;
    const mkOf = v => c => ((v && v.mk) || {})[c] === '上櫃' ? '上櫃' : '上市';
    const stockEv = (v, label) => {
      const mk = mkOf(v);
      Object.entries(v.sec || {}).forEach(([c, nm]) => { if (!sec[c]) sec[c] = [nm, mk(c)]; });
      (v.ev || []).forEach(e => { addActual(e[0], { code: e[0], ex: e[1], pay: e[2] || '', cash: +e[3] || 0, est: !!e[5] }); n++; });
    };
    if (st.status === 'fulfilled' && st.value && st.value.ok) { stockEv(st.value); updated = st.value.updated || ''; }
    else warn.push(st.reason ? st.reason.message : '個股資料服務回傳空資料');
    if (sp.status === 'fulfilled' && sp.value && sp.value.ok) stockEv(sp.value);
    if (et.status === 'fulfilled' && et.value && et.value.etfs) {
      const d = et.value;
      d.etfs.forEach(x => { sec[x.code] = [x.name, 'ETF']; });
      [d.events, d.prevEvents].forEach(group => Object.entries(group || {}).forEach(([c, list]) => list.forEach(x => {
        if (x.ex) { addActual(c, { code: c, ex: x.ex, pay: x.pay || '', cash: +x.dps || 0, est: !!(x.estPay || x.estDps) }); n++; }
      })));
      if (d.base && d.base > updated) updated = d.base;
    } else warn.push(et.reason ? et.reason.message : 'ETF 資料服務回傳空資料，可能尚未上傳或部署版本不對');
    hideLoader();
    if (!n) { showFail(warn.join('；') || '讀取資料失敗'); return; }
    DATA = { asof: TODAY, updated, sec, warn };
    $('codes').innerHTML = Object.keys(sec).sort().map(c => `<option value="${c} ${sec[c][0]}">`).join('');
    syncURL();
    render();
    if (warn.length) toast(warn[0]);
    else if (fromLink) toast(`已帶入分享連結的庫存（${holdings.length} 檔）`);
    postToApp({ type: 'ready', title: '我的股息現金流', updated });
  });
}
function hideLoader() { const l = $('loader'); if (l) l.classList.add('done'); }
function showFail(msg) {
  $('months').innerHTML = `<div class="emptyhint">讀取資料失敗<br>${msg}</div>`;
  postToApp({ type: 'error', message: msg });
}
/* ---------- 嵌入 APP（?embed=1）---------- */
if (QS.get('embed') === '1') document.documentElement.classList.add('embed');
function postToApp(obj) {
  const msg = JSON.stringify(obj);
  try { if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(msg); return; } } catch (e) {}
  try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lingxi) { window.webkit.messageHandlers.lingxi.postMessage(obj); return; } } catch (e) {}
  try { if (window.LingxiAndroid) { window.LingxiAndroid.postMessage(msg); return; } } catch (e) {}
  try { if (window.Lingxi && window.Lingxi.postMessage) { window.Lingxi.postMessage(msg); return; } } catch (e) {}
  try { if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('lingxi', obj); } catch (e) {}
}
boot();
</script>
</body>
