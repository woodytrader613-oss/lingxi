<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國際總經月曆｜影響台股的國際數據與央行決議</title>
<meta name="description" content="國際總經月曆：未來一個月美國、中國、日本、韓國、台灣影響台股的重要經濟數據與央行利率決議，前次、最新、市場預估、倒數日與對台股的好壞解讀一次看。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1014;--panel:#181B21;--panel2:#111317;--line:#22262D;--line2:#3A3F48;--ink:#E6E8EB;--ink2:#C9CDD3;--muted:#9AA0A8;--dim:#7E848D;--accent:#F5C542;--up:#FF5C5C;--down:#2FC56E;
  --bull:#FF8A80;--bear:#5BD69A;
  --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;--mono:'Roboto Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px;padding-top:env(safe-area-inset-top)}
header.top h1{margin:0;font-size:18px;line-height:22px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asof{flex:none;font-size:12px;line-height:16px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;padding:4px 16px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#14161A;font-weight:700}
.regime{font-size:12px;color:var(--muted);white-space:nowrap}
.regime b{color:var(--accent)}
.tblbox{flex:1;min-height:320px;overflow:auto;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
table.t{border-collapse:separate;border-spacing:0;font-size:13px;color:var(--ink);width:100%;min-width:1120px}
.t th{position:sticky;top:0;z-index:2;background:#1A1D23;color:#A9AFB7;font-weight:500;font-size:12px;line-height:14px;padding:0 8px;height:44px;border-bottom:1px solid #2A2E36;text-align:center;white-space:nowrap}
.t th button{width:100%;height:44px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;padding:0}
.t th button[aria-sort="ascending"],.t th button[aria-sort="descending"]{color:var(--accent)}
.t td{padding:10px 10px;border-bottom:1px solid var(--line);background:var(--panel2);vertical-align:middle;white-space:nowrap}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:#15181D}
.t tbody tr.open td{background:#171A20}
.t .stick{position:sticky;left:0;z-index:1;border-right:1px solid #2A2E36;width:190px;min-width:150px;white-space:normal}
.t th.stick{z-index:3}
.t .br{border-right:1px solid #2A2E36}
.t .bl{border-left:1px solid #2A2E36}
.nm{display:flex;flex-direction:column;gap:3px}
.nm .meta{display:flex;gap:6px;align-items:center;font-size:11px}
.cc{font-family:var(--mono);color:var(--ink2);border:1px solid #45464B;border-radius:4px;padding:0 4px;line-height:15px}
.stars{color:var(--accent);letter-spacing:1px}.stars i{font-style:normal;color:#474B52}
.nm .n{font-size:15px;line-height:20px;font-weight:500}
.c{text-align:center}
.r{text-align:right}
.v{font-size:15px}
.d{font-size:12px;margin-top:3px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--ink2)}.pend{color:var(--dim)}
.days{font-size:16px}.days.soon{color:var(--up);font-weight:700}
.dt{font-size:14px}.tm{font-size:12px;color:var(--muted);margin-top:2px}
.jd{display:flex;flex-direction:column;gap:5px;font-size:12px}
.jd span.row{display:flex;gap:6px;align-items:center}
.jd .lb{color:var(--muted);min-width:56px}
.tag{padding:1px 8px;border-radius:5px;font-size:12px;line-height:18px;border:1px solid}
.tag.bull{color:var(--bull);background:rgba(255,90,80,.14);border-color:rgba(255,90,80,.4)}
.tag.bear{color:var(--bear);background:rgba(60,200,130,.12);border-color:rgba(60,200,130,.4)}
.tag.neu{color:#C8C8C8;background:rgba(255,255,255,.06);border-color:#3A3B40}
.last{border-top:1px dashed #34353A;padding-top:5px;color:#8E8E93;font-size:11px}
.last b.bull{color:var(--bull)}.last b.bear{color:var(--bear)}.last b.neu{color:#C8C8C8}
.t td.desc{white-space:normal;min-width:320px;max-width:460px}
.desc .tx{font-size:14px;line-height:1.65;color:#E0E3E7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
tr.open .desc .tx{display:block;-webkit-line-clamp:unset}
.desc .src{font-size:11px;color:var(--dim);margin-top:4px}
.state{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.foot{padding:12px 16px 28px;font-size:12px;line-height:1.7;color:var(--muted)}
.foot .bull{color:var(--bull);font-weight:700}.foot .bear{color:var(--bear);font-weight:700}
/* 手機明細 */
.sheet{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;justify-content:flex-end}
.sheet.open{display:flex}
.sheet .scrim{position:absolute;inset:0;border:0;background:rgba(0,0,0,.6);cursor:pointer}
.sheet section{position:relative;width:100%;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);align-self:center}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sh-head h2{margin:2px 0 0;font-size:18px;line-height:24px}
.sh-sub{font-size:12px;color:var(--muted)}
.x{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--panel2);border-radius:12px;padding:10px 12px}
.g3 .lbl{font-size:11px;color:var(--muted)}
.sh-text{margin:0;font-size:15px;line-height:1.8;color:#E0E3E7}
#loader{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .25s}
#loader.done{opacity:0;pointer-events:none}
#loader .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 嵌入模式（APP WebView） */
.embed,.embed body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.embed header.top{min-height:36px}
.embed header.top h1{visibility:hidden}
.embed.embed-header header.top{min-height:52px}
.embed.embed-header header.top h1{visibility:visible}
@media (max-width:719px){
  table.t{min-width:860px;font-size:12px}
  .t td{padding:8px 7px}
  .t .stick{width:116px;min-width:116px;max-width:116px}
  .nm .n{font-size:13px;line-height:17px}
  .v{font-size:13px}.d{font-size:11px}
  .u{display:none}
  .days{font-size:14px}.dt{font-size:12px}.tm{font-size:11px}
  .jd{font-size:11px}.jd .lb{min-width:0}.tag{font-size:11px;padding:0 6px}
  .t td.desc{min-width:220px;max-width:240px}.desc .tx{font-size:12px;line-height:1.55}.desc .src{display:none}
  tr.open .desc .tx{display:-webkit-box;-webkit-line-clamp:3}
  .regime{width:100%}
}
</style>
</head>
<body>
<div id="loader"><div class="spin" aria-label="載入中"></div></div>
<div class="wrap">
  <header class="top">
    <h1>國際總經月曆</h1>
    <div class="asof" id="sub"></div>
  </header>
  <div class="bar">
    <div class="chips" id="chips" role="group" aria-label="國別"></div>
    <div class="regime" id="regime"></div>
  </div>
  <div class="tblbox" id="tblbox">
    <table class="t" id="tbl">
      <thead><tr>
        <th class="stick"><button type="button" data-sort="name">總經項目 <span class="ar" data-k="name">⇅</span></button></th>
        <th>前次數據</th>
        <th>最新數據</th>
        <th>預估數據</th>
        <th class="br"><button type="button" data-sort="days">倒數日 <span class="ar" data-k="days">⇅</span></button></th>
        <th><button type="button" data-sort="days">預計公告日 <span class="ar" data-k="days">⇅</span></button></th>
        <th>好壞解讀</th>
        <th class="bl">完整說明</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="state" id="state" hidden></div>
  </div>
  <div class="foot" id="foot">
    最新數據下方＝與前次的差；預估數據下方＝與最新的差（紅漲綠跌）。好壞解讀的 <span class="bull">偏多</span>／<span class="bear">偏空</span> 是對台股的影響方向，和數字漲跌分開看；「待共識」代表市場預估尚未公布。時間皆為台灣時間。內容僅供參考，不構成投資建議。
  </div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <button class="scrim" type="button" aria-label="關閉" data-close="1"></button>
  <section role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="grab"></div>
    <div class="sh-head">
      <div><div class="sh-sub" id="shSub"></div><h2 id="shTitle"></h2></div>
      <button class="x" type="button" aria-label="關閉" data-close="1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="g3" id="shNums"></div>
    <div class="jd" id="shJd"></div>
    <p class="sh-text" id="shText"></p>
    <div class="desc"><div class="src" id="shSrc" style="display:block"></div></div>
  </section>
</div>

<script>
const DATA_URL = 'https://script.google.com/macros/s/AKfycbwBGACmpSxydR701wwVRDnEOptH7T5jtIZZy2lo7GbhK5wlkcAfn8oh-QKyfcT9dvTP/exec';
/* 網址參數
   ?embed=1：隱藏頁面名稱（資料日期仍在右上角）；?embed=1&header=1：顯示頁面名稱。
   ?cc=US：預設只看某國（US、CN、JP、KR、TW）。 */
const QS = new URLSearchParams(location.search);
if (QS.get('embed') === '1') {
  document.documentElement.classList.add('embed');
  if (QS.get('header') === '1') document.documentElement.classList.add('embed-header');
}
function postApp(obj) {
  const msg = JSON.stringify(obj);
  try { if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(msg); return true; } } catch (e) {}
  try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lingxi) { window.webkit.messageHandlers.lingxi.postMessage(obj); return true; } } catch (e) {}
  try { if (window.LingxiAndroid && window.LingxiAndroid.postMessage) { window.LingxiAndroid.postMessage(msg); return true; } } catch (e) {}
  try { if (window.Lingxi && window.Lingxi.postMessage) { window.Lingxi.postMessage(msg); return true; } } catch (e) {}
  try { if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) { window.flutter_inappwebview.callHandler('lingxi', obj); return true; } } catch (e) {}
  return false;
}

const CC_NAME = { US: '美國', CN: '中國', JP: '日本', KR: '韓國', TW: '台灣' };
const CC_ORDER = ['US', 'CN', 'JP', 'KR', 'TW'];
const WD = ['日', '一', '二', '三', '四', '五', '六'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ROWS = [], STATE = { cc: QS.get('cc') && CC_NAME[QS.get('cc')] ? QS.get('cc') : 'ALL', sort: 'days', dir: 1, open: null };

function taipeiToday() {
  const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  return p; // yyyy-mm-dd
}
function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function isRange(ind) { return /區間上限/.test(ind.name); }
function cleanName(ind) { return ind.name.replace(/（[^）]*區間上限[^）]*）/, ''); }
function decOf(ind) { return ind.type === '央行' ? 2 : 1; }
function fmtVal(ind, v) {
  if (v == null) return '—';
  const d = decOf(ind);
  if (isRange(ind)) return (v - 0.25).toFixed(2) + '–' + v.toFixed(2) + '%';
  const s = v.toFixed(d);
  if (ind.unit === '%') return s + '%';
  if (ind.unit === '萬人') return s + '萬';
  return s;
}
function fmtChg(ind, d) {
  if (d == null) return { html: '', cls: 'flat' };
  const r = Math.round(d * 10000) / 10000;
  if (r === 0) return { html: '持平', cls: 'flat' };
  const sign = r > 0 ? '▲' : '▼', cls = r > 0 ? 'up' : 'down', a = Math.abs(r);
  if (ind.type === '央行') {
    const q = a / 0.25;
    return { html: sign + (Number.isInteger(Math.round(q * 100) / 100) ? Math.round(q) + '碼' : a.toFixed(2) + '個百分點'), cls };
  }
  const n = a.toFixed(decOf(ind));
  if (ind.diffUnit === '個百分點') return { html: sign + n + '<span class="u">個百分點</span>', cls };
  if (ind.diffUnit === '萬') return { html: sign + n + '萬', cls };
  if (ind.diffUnit === '點') return { html: sign + n + '點', cls };
  return { html: sign + n, cls };
}
function tagCls(t) { return t === '偏多' ? 'bull' : (t === '偏空' ? 'bear' : 'neu'); }
function md(s) { return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }
function valOf(r) { return r.revised != null ? r.revised : r.actual; }
function byDate(a, b) { return (a.date || '').localeCompare(b.date || '') || a.period.localeCompare(b.period) || a.rid.localeCompare(b.rid); }

function build(d) {
  const today = taipeiToday();
  const rows = [];
  d.indicators.forEach((ind) => {
    const rs = d.releases.filter((r) => r.id === ind.id);
    const done = rs.filter((r) => r.status === '已公布').sort(byDate);
    const next = rs.filter((r) => r.status !== '已公布').sort(byDate)[0];
    if (!next) return;
    const latest = done[done.length - 1], prev = done[done.length - 2];
    const lv = latest ? valOf(latest) : null, pv = prev ? valOf(prev) : null;
    const days = next.date ? dayDiff(today, next.date) : null;
    const itps = d.interps.filter((x) => x.rid === next.rid).sort((a, b) => b.ver - a.ver);
    const it = itps[0];
    let last = null;
    if (latest && latest.date && latest.result && dayDiff(latest.date, today) <= 7) {
      const t = latest.result === '符合預期' ? '中性' : latest.result;
      const title = latest.diff > 0 ? ind.aboveTitle : (latest.diff < 0 ? ind.belowTitle : '符合預期');
      const amt = latest.diff ? ' ' + fmtChg(ind, Math.abs(latest.diff)).html.replace(/^▲/, '').replace(/<[^>]+>/g, '') : '';
      last = { text: md(latest.date) + ' ' + title + amt, tag: t };
    }
    let timeTxt = next.time || '';
    if (next.timeStatus === '待公告') timeTxt = '時間待公告';
    rows.push({
      ind, next, days, today,
      name: cleanName(ind), cc: ind.cc, stars: Math.max(1, Math.min(3, ind.stars)),
      prev: fmtVal(ind, pv), latest: fmtVal(ind, lv), latestChg: fmtChg(ind, lv != null && pv != null ? lv - pv : null),
      est: next.est != null ? fmtVal(ind, next.est) : '待共識', pending: next.est == null,
      estChg: next.est != null && lv != null ? fmtChg(ind, next.est - lv) : { html: '', cls: 'flat' },
      date: next.date ? next.date.replace(/-/g, '/') : '待公告', wd: next.date ? WD[new Date(next.date + 'T12:00:00Z').getUTCDay()] : '', time: timeTxt,
      text: it ? it.text : '解讀撰寫中。', src: '來源：' + (ind.source || '—') + (it && it.date ? '｜解讀 ' + md(it.date) + ' 更新' : ''),
      last
    });
  });
  return rows;
}

function daysCell(r) {
  if (r.days == null) return '<span class="days">—</span>';
  if (r.days < 0) return '<span class="days pend">待更新</span>';
  if (r.days === 0) return '<span class="days soon">今天</span>';
  return '<span class="days num' + (r.days <= 1 ? ' soon' : '') + '">' + r.days + '</span>';
}
function judgeHtml(r) {
  const i = r.ind;
  let h = '<span class="row"><span class="lb">' + esc(i.aboveTitle) + '</span><span class="tag ' + tagCls(i.aboveTag) + '">' + esc(i.aboveTag || '—') + '</span></span>'
        + '<span class="row"><span class="lb">' + esc(i.belowTitle) + '</span><span class="tag ' + tagCls(i.belowTag) + '">' + esc(i.belowTag || '—') + '</span></span>';
  if (r.last) h += '<span class="last">上次 ' + esc(r.last.text) + ' <b class="' + tagCls(r.last.tag) + '">' + esc(r.last.tag) + '</b></span>';
  return h;
}
function stars(n) { return '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>'; }

function render() {
  const list = ROWS.filter((r) => STATE.cc === 'ALL' || r.cc === STATE.cc).slice();
  const dir = STATE.dir;
  if (STATE.sort === 'days') list.sort((a, b) => ((a.days == null ? 9999 : a.days) - (b.days == null ? 9999 : b.days)) * dir || a.ind.order - b.ind.order);
  else list.sort((a, b) => (CC_ORDER.indexOf(a.cc) - CC_ORDER.indexOf(b.cc) || a.ind.order - b.ind.order) * dir);
  $('tb').innerHTML = list.map((r) => {
    const id = esc(r.ind.id);
    return '<tr data-id="' + id + '" class="' + (STATE.open === r.ind.id ? 'open' : '') + '" tabindex="0" aria-expanded="' + (STATE.open === r.ind.id) + '">'
      + '<td class="stick"><div class="nm"><span class="meta"><span class="cc">' + esc(r.cc) + '</span><span class="stars" aria-label="重要度 ' + r.stars + '">' + stars(r.stars) + '</span></span><span class="n">' + esc(r.name) + '</span></div></td>'
      + '<td class="c num v">' + esc(r.prev) + '</td>'
      + '<td class="r num"><div class="v ' + r.latestChg.cls + '">' + esc(r.latest) + '</div><div class="d ' + r.latestChg.cls + '">' + r.latestChg.html + '</div></td>'
      + '<td class="r num"><div class="v ' + (r.pending ? 'pend' : r.estChg.cls) + '">' + esc(r.est) + '</div><div class="d ' + r.estChg.cls + '">' + r.estChg.html + '</div></td>'
      + '<td class="r br">' + daysCell(r) + '</td>'
      + '<td><div class="dt num">' + esc(r.date) + (r.wd ? '（' + r.wd + '）' : '') + '</div><div class="tm">' + esc(r.time) + '</div></td>'
      + '<td><div class="jd">' + judgeHtml(r) + '</div></td>'
      + '<td class="desc bl"><div class="tx">' + esc(r.text) + '</div><div class="src">' + esc(r.src) + '</div></td>'
      + '</tr>';
  }).join('');
  $('state').hidden = list.length > 0;
  if (!list.length) $('state').textContent = '這個國家目前沒有即將公布的項目。';
  document.querySelectorAll('.ar').forEach((s) => {
    const k = s.dataset.k;
    s.textContent = STATE.sort === k ? (STATE.dir === 1 ? '▲' : '▼') : '⇅';
    s.parentElement.setAttribute('aria-sort', STATE.sort === k ? (STATE.dir === 1 ? 'ascending' : 'descending') : 'none');
  });
}

function renderChips() {
  const have = CC_ORDER.filter((c) => ROWS.some((r) => r.cc === c));
  if (STATE.cc !== 'ALL' && !have.includes(STATE.cc)) STATE.cc = 'ALL';
  $('chips').innerHTML = ['ALL'].concat(have).map((c) => '<button type="button" class="chip" data-cc="' + c + '" aria-pressed="' + (STATE.cc === c) + '">' + (c === 'ALL' ? '全部' : CC_NAME[c]) + '</button>').join('');
}

function openSheet(r) {
  $('shSub').textContent = r.cc + '｜' + r.date + (r.wd ? '（' + r.wd + '）' : '') + ' ' + r.time + (r.days != null && r.days >= 0 ? '｜倒數 ' + r.days + ' 天' : '');
  $('shTitle').textContent = r.name;
  $('shNums').innerHTML = '<div><div class="lbl">前次</div><div class="num v">' + esc(r.prev) + '</div></div>'
    + '<div><div class="lbl">最新</div><div class="num v ' + r.latestChg.cls + '">' + esc(r.latest) + '</div></div>'
    + '<div><div class="lbl">預估</div><div class="num v ' + (r.pending ? 'pend' : r.estChg.cls) + '">' + esc(r.est) + '</div></div>';
  $('shJd').innerHTML = judgeHtml(r);
  $('shText').textContent = r.text;
  $('shSrc').textContent = r.src;
  $('sheet').classList.add('open');
  $('sheet').setAttribute('aria-hidden', 'false');
}
function closeSheet() { $('sheet').classList.remove('open'); $('sheet').setAttribute('aria-hidden', 'true'); }

function onRow(id) {
  const r = ROWS.find((x) => x.ind.id === id);
  if (!r) return;
  if (window.matchMedia('(max-width:719px)').matches) { openSheet(r); return; }
  STATE.open = STATE.open === id ? null : id;
  render();
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) { STATE.cc = chip.dataset.cc; STATE.open = null; renderChips(); render(); $('tblbox').scrollTo({ top: 0, left: 0 }); return; }
  const sb = e.target.closest('th button[data-sort]');
  if (sb) { const k = sb.dataset.sort; STATE.dir = STATE.sort === k ? -STATE.dir : 1; STATE.sort = k; render(); return; }
  if (e.target.closest('[data-close]')) { closeSheet(); return; }
  const tr = e.target.closest('#tb tr');
  if (tr) onRow(tr.dataset.id);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('#tb tr')) { e.preventDefault(); onRow(e.target.dataset.id); }
});

function onData(d) {
  if (!d || !d.indicators) throw new Error(d && d.error ? d.error : '資料格式不正確');
  ROWS = build(d);
  $('sub').textContent = '資料日期 ' + (d.asof || '').replace(/-/g, '/');
  $('regime').innerHTML = d.regime ? '目前市場情境：<b>' + esc(d.regime) + '</b>' : '';
  renderChips();
  render();
  $('loader').classList.add('done');
  postApp({ type: 'ready', title: '國際總經月曆', base: d.asof });
}
function onFail(err) {
  $('loader').classList.add('done');
  $('tb').innerHTML = '';
  $('state').hidden = false;
  $('state').textContent = '資料讀取失敗，請稍後重新整理。';
  postApp({ type: 'error', message: String(err && err.message || err) });
}
fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 'format=json', { cache: 'no-store' })
  .then((r) => r.json()).then(onData)
  .catch((e) => onFail(/請貼上/.test(DATA_URL) ? '尚未設定資料網址（DATA_URL）' : e));
</script>
</body>
</html>
